name: OnlineSeti VPN for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.1.2)
        required: true
        default: "1.1.2"
        type: string
      publish:
        description: Publish this build to GitHub Releases for in-app updates
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ONLINESETI_EDITION: "1"
      INPUT_VERSION: ${{ inputs.version }}
      DEST_SUFFIX: windows-amd64
      ARCH: x64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: windows-client
      - name: Validate release version and record source revision
        shell: bash
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $INPUT_VERSION" >&2
            exit 1
          fi
          echo "INPUT_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: core/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ github.token }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Go protobuf generators
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build OnlineSeti core and transports
        shell: bash
        run: |
          export GOOS=windows GOARCH=amd64 RUNNER_OS=Windows ARCH=x64
          export DEST="$(cygpath -u "$GITHUB_WORKSPACE/deployment/windows-amd64")"
          bash script/build_csqtt.sh
          bash script/build_go.sh
          cp csqtt-artifact/* "$DEST/"
      - name: Bundle the web dashboard
        shell: bash
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/SagerNet/sing-box-dashboard.git dashboard-src
          rm -rf dashboard-src/.git res/dashboard
          cp -R dashboard-src/. res/dashboard/
          test -f res/dashboard/index.html
      - name: Install Qt and OpenSSL
        shell: bash
        run: |
          curl -fL -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.11.2/Qt_6.11.2_x64.7z
          curl -fL -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z
          7z x qt.7z
          7z x openssl.7z
      - name: Build OnlineSeti VPN GUI
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export CMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/Qt/lib/cmake"
          export OPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/openssl"
          mkdir -p build download-artifact/local
          cd build
          curl -fLso srslist.h https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DONLINESETI_EDITION=ON \
            -DINPUT_VERSION="$INPUT_VERSION" -DQTHRONE_REPOSITORY="$GITHUB_REPOSITORY" ..
          ninja
          cd ..
          mkdir -p "download-artifact/Throne-${GITHUB_SHA}-windows-amd64"
          tar czf "download-artifact/Throne-${SOURCE_SHA}-windows-amd64/artifacts.tgz" deployment/windows-amd64
          export DEST="$(cygpath -u "$GITHUB_WORKSPACE/deployment/windows-amd64")"
          ./script/deploy_windows.sh
      - name: Verify packaged startup and updater
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'deployment/windows-amd64/OnlineSetiVPN.exe'
          $p = Start-Process -FilePath $app -ArgumentList '--self-test-core-startup' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Packaged core startup failed: $($p.ExitCode)" }
          $import = Start-Process -FilePath $app -ArgumentList '--self-test-qwdtt-import' -Wait -PassThru -WindowStyle Hidden
          if ($import.ExitCode -ne 0) { throw "Release asset and profile import tests failed: $($import.ExitCode)" }
          Push-Location updater
          go test ./...
          Pop-Location
      - name: Package portable client
        shell: bash
        run: |
          export APP_NAME=OnlineSetiVPN ARCHIVE_NAME=OnlineSetiVPN
          bash script/pack_release.sh windows "$INPUT_VERSION"
      - name: Verify portable archive layout
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $env:GITHUB_WORKSPACE "deployment/OnlineSetiVPN-$env:INPUT_VERSION-windows64.zip"
          if (!(Test-Path -LiteralPath $archive)) { throw "Portable archive missing: $archive" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @(
              'OnlineSetiVPN/OnlineSetiVPN.exe',
              'OnlineSetiVPN/OnlineSetiCore.exe',
              'OnlineSetiVPN/OnlineSetiUpdater.exe',
              'OnlineSetiVPN/OnlineSetiWDTT.exe',
              'OnlineSetiVPN/OnlineSetiWDTTPlus.exe',
              'OnlineSetiVPN/OnlineSetiOpenFlux.exe',
              'OnlineSetiVPN/OnlineSetiOLCRTC.exe',
              'OnlineSetiVPN/csqtt-transport.exe'
            )) {
              if ($names -notcontains $required) { throw "Required runtime file missing from archive: $required" }
            }
            if ($names | Where-Object { $_ -match '(^|/)(config|profiles)/|\.db($|/)' }) {
              throw 'Portable release archive must not contain user settings or databases'
            }
          } finally { $zip.Dispose() }
          & 7z t $archive
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive integrity check failed' }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: OnlineSetiVPN-${{ inputs.version }}-windows64
          path: deployment/OnlineSetiVPN-${{ inputs.version }}-windows64.zip
          if-no-files-found: error
          compression-level: 0
      - name: Publish in-app update release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${INPUT_VERSION#v}"
          gh release create "$tag" "deployment/OnlineSetiVPN-${INPUT_VERSION}-windows64.zip" \
            --target "$SOURCE_SHA" --title "OnlineSeti VPN $INPUT_VERSION for Windows" \
            --notes "OnlineSeti VPN for Windows. This release is available from the in-app updater."

