name: OnlineSeti VPN transports
run-name: OnlineSeti VPN transports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clients:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install NDK
        shell: bash
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build pinned transport clients
        shell: bash
        run: bash scripts/build_carrier_clients.sh '${{ matrix.abi }}'
      - name: Upload native clients and provenance
        uses: actions/upload-artifact@v7
        with:
          name: OnlineSetiVPN-carriers-${{ matrix.abi }}
          path: deployment/carriers/${{ matrix.abi }}/
          if-no-files-found: error
